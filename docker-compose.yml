# Frontend em Docker: serviço web-dev (Vite + hot reload). A API (perfil docker-api) está
# sem camada de base de dados no código — só GET / e CORS ate reintroduzires rotas/BD.
#
# Outro PC (dev, hot reload):  scripts\docker-subir-dev.ps1
# Outro PC (tudo em Docker):   scripts\docker-subir-tudo.ps1
#
# API também em Docker:
#   docker compose --profile docker-api up -d --build
# A pasta ./backend está montada em /app e o uvicorn corre com --reload (dev).
#
# Obrigatorio no repo: frontend/package.json + frontend/package-lock.json
# (npm ci no arranque do web-dev instala xlsx e restantes deps).

services:
  api:
    profiles:
      - docker-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    command:
      [
        "uvicorn",
        "app.core.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    environment:
      SECRET_KEY: ${SECRET_KEY:-inventario-dev-secret-key-change-in-production}
      # Docker Desktop (Windows/mac): ajuda o --reload a detetar alterações nos ficheiros
      WATCHFILES_FORCE_POLLING: "true"

  web-dev:
    profiles:
      - dev-live
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: inventario-frontend-dev
    container_name: frontend-dev
    restart: unless-stopped
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  frontend_node_modules:
