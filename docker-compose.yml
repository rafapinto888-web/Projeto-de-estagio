# Por defeito: só o site (web). A API corre no Windows em localhost:8000 e usa a tua
# PostgreSQL no PC — assim o login usa os mesmos utilizadores que no pgAdmin.
#
# API também em Docker (usa Postgres no PC via host.docker.internal):
#   docker compose --profile docker-api up -d --build
#
# Postgres só em Docker (BD isolada, host porta 5433):
#   docker compose --profile bundled-db up -d --build

services:
  db:
    profiles:
      - bundled-db
    image: postgres:16-alpine
    container_name: inventario-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventario
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: inventario-docker
    ports:
      - "5433:5432"
    volumes:
      - inventario_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventario"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    profiles:
      - docker-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventario-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:12345a.@host.docker.internal:5432/inventario}
      SECRET_KEY: ${SECRET_KEY:-inventario-dev-secret-key-change-in-production}

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    container_name: inventario-web
    restart: unless-stopped
    ports:
      - "5173:80"

volumes:
  inventario_pgdata:
